services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: aichat-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=aichat
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "15673:15672"

  mysql:
    image: mysql:8.0
    container_name: aichat-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=aichat
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  redis:
    image: redis:7-alpine
    container_name: aichat-redis
    command: ["redis-server", "--protected-mode", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
  
  weaviate:
    image: semitechnologies/weaviate:1.38.1
    container_name: aichat-weaviate
    ports:
      - "8082:8080"
      - "50052:50051"
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - ENABLE_MODULES=
      - CLUSTER_HOSTNAME=node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: on-failure:0

  backend:
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    build: 
      context: ..
      dockerfile: deploy/backend.dockerfile  
    container_name: aichat-backend
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
    volumes: 
      - ../config/config.docker.toml:/app/config/config.toml:ro
    ports:
      - "8081:8080"
    
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.dockerfile
    container_name: aichat-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend          # 保证 backend 先启动，避免 nginx 起时 backend DNS 未就绪
    restart: unless-stopped  # 双保险：若仍因时序启动失败，自动重启直到就绪

volumes:
  mysql_data:
  redis_data:
  weaviate_data:
